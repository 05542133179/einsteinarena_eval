[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openarena-eval-kit"
version = "0.1.0"
description = "Reproducible EinsteinArena/OpenArena task sync, local scoring, and leaderboard toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mpmath>=1.3,<2",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.14,<2",
]

[project.scripts]
openarena-eval = "openarena_eval.cli:main"

[tool.setuptools.packages.find]
include = ["openarena_eval*"]

[tool.setuptools.package-data]
openarena_eval = ["_data/**/*"]
